# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # The API reference documents the main branch of genesis-world, which can be ahead of the latest release on PyPI.
    post_install:
      - pip install --upgrade "genesis-world @ https://github.com/Genesis-Embodied-AI/genesis-world/archive/refs/heads/main.zip"

sphinx:
  configuration: source/conf.py

python:
  install:
    - requirements: requirements.txt
